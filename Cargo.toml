[package]
name = "pml-lsp"
version = "0.4.0"
edition = "2021"

[dependencies]
tower-lsp = "0.20"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dashmap = "6"

# Tree-sitter runtime
tree-sitter = "0.25"

# The PML grammar. Fetched from GitHub so a fresh clone builds anywhere.
tree-sitter-pml = { git = "https://github.com/djee79/tree-sitter-pml.git", branch = "main" }

# To build against a local checkout of the grammar instead, uncomment:
# [patch."https://github.com/djee79/tree-sitter-pml.git"]
# tree-sitter-pml = { path = "../tree-sitter-pml" }

